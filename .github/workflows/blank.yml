name: Ambiorix POS - Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: AmbiorixPOS-Android-Project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project
        run: |
          java -version
          test -f gradlew
          test -f settings.gradle.kts
          chmod +x gradlew
          ./gradlew --version

      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build Debug APK
        id: apk
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPOS-Debug-APK
          path: AmbiorixPOS-Android-Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPOS-Test-Reports
          path: |
            AmbiorixPOS-Android-Project/app/build/reports/tests/testDebugUnitTest/
            AmbiorixPOS-Android-Project/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Las pruebas unitarias fallaron. Revisa los informes."
          exit 1
