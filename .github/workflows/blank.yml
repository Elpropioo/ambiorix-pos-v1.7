name: Ambiorix POS - Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compile and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: AmbiorixPOS-Android-Project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify project files
        run: |
          java -version
          gradle --version
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Compile Kotlin
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build Debug APK
        id: apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Debug APK
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPOS-Debug-APK
          path: AmbiorixPOS-Android-Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPOS-Test-Reports
          path: |
            AmbiorixPOS-Android-Project/app/build/reports/tests/testDebugUnitTest/
            AmbiorixPOS-Android-Project/app/build/test-results/testDebugUnitTest
