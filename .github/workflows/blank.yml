name: Ambiorix POS - Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          echo "Buscando el proyecto Android..."
          find . -maxdepth 5 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print

          WRAPPER="$(find . -maxdepth 5 -type f -name gradlew -print -quit)"
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
          else
            SETTINGS="$(find . -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$SETTINGS" ]; then
              echo "::error::No se encontró gradlew ni settings.gradle. El repositorio debe contener el proyecto Android."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          echo "Proyecto detectado: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Java and Gradle wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          java -version
          if [ ! -f ./gradlew ]; then
            echo "::error::El proyecto no incluye gradlew. Debes añadir el Gradle Wrapper."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        id: tests
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPOS-Debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPOS-Test-Reports
          path: |
            **/build/reports/tests/testDebugUnitTest/
            **/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::La compilación se ejecutó, pero fallaron pruebas unitarias."
          exit 1
